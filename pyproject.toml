[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seg2mri"
version = "0.1.0"
description = "Segmentation-conditioned MRI synthesis with diffusion, trained from scratch on public data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arpan Chakraborty" }]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "nibabel>=5.0",
    "PyYAML>=6.0",
    "scikit-image>=0.22",
    "tqdm>=4.66",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["seg2mri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
